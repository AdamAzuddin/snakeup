<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SnakeUp</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <style>
    #gameCanvas {
      width: 100vw;
      height: 100vh;
      margin: 0 auto;
    }

    #endScreen {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.8);
      padding: 20px 40px;
      border-radius: 10px;
      text-align: center;
      display: none;
      color: white;
      font-size: 24px;
    }

    #homeBtn {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
  <body>
    <div id="controls">
      <button id="startBtn">Start Game</button>
      <button id="resetBtn" style="display: none">Start Over</button>
    </div>
    <div id="gameContainer">
      <canvas id="gameCanvas"></canvas>
      <div id="score">Score: <span id="scoreValue">0</span></div>
    </div>

    <div id="endScreen">
      <div id="endMessage">Game Over</div>
      <button id="homeBtn">Home</button>
    </div>
    <script src="game.js"></script>
  </body>
</html>
